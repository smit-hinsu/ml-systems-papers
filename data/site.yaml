name: "ML Systems Papers"
tagline: "Curated paper index for ML infrastructure: LLM serving & training, agentic inference, recommendation models, compilers, and fleet efficiency"
github: "smit-hinsu/ml-systems-papers"
description: >
  A community-maintained, semi-structured index of papers at the intersection of
  machine learning and systems. Papers from MLSys, OSDI, SOSP, ASPLOS, NeurIPS
  systems track, and beyond — organized by observation, domain, and topic rather
  than by conference or date.

