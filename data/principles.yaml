# Principles registry.
# Each principle is a general, cross-cutting idea that recurs across multiple papers.
# Principles are generic (not ML-systems-specific); the ML-specific context lives in
# each paper's `observations:` dict.
#
# slug:
#   label: Full principle statement (action-verb format); used on the principles page
#   short: One- or two-word name; used where the observation supplies the context
#   category: efficiency | memory | distributed | tooling
#   description: 1-2 sentences. Generic — does not mention specific ML systems or papers.

cache:
  label: "Cache to avoid repeated computation"
  short: "Cache"
  category: efficiency
  description: >
    Results for repeated inputs can be stored so they are computed only once.
    The savings are proportional to reuse frequency and the cost of recomputation.

pipeline:
  label: "Pipeline independent work to hide latency"
  short: "Pipeline"
  category: efficiency
  description: >
    Two operations that do not depend on each other can run concurrently,
    hiding the latency of the slower one behind the faster one.

skip:
  label: "Skip provably unnecessary work"
  short: "Skip"
  category: efficiency
  description: >
    When inputs or intermediate values are known to be irrelevant — sparse, zero,
    pruned, or outside an attended region — the corresponding computation can be
    skipped without affecting correctness or meaningful accuracy.

fuse:
  label: "Fuse operations to minimize memory bandwidth"
  short: "Fuse"
  category: memory
  description: >
    Moving data between compute and memory — or between memory tiers — is often
    more expensive than the computation itself. Fusing operations and tiling reduces
    the number of memory round-trips.

tier:
  label: "Keep hot data near compute"
  short: "Tier"
  category: memory
  description: >
    Memory systems have a hierarchy of tiers with orders-of-magnitude differences
    in bandwidth and latency. Performance depends on keeping frequently accessed
    data in the fastest tier and evicting cold data to slower, larger tiers.

recompute:
  label: "Recompute to save storage"
  short: "Recompute"
  category: memory
  description: >
    Some intermediate values are cheaper to recompute on demand than to store.
    Trading compute for memory frees capacity for the working set that cannot
    be reconstructed cheaply.

quantize:
  label: "Quantize to trade precision for efficiency"
  short: "Quantize"
  category: efficiency
  description: >
    Reducing numerical precision from FP32 to lower-bit formats shrinks memory
    footprint and accelerates arithmetic, at the cost of representational fidelity.
    The acceptable precision loss is workload- and layer-dependent.

approximate:
  label: "Approximate to trade quality for efficiency"
  short: "Approximate"
  category: efficiency
  description: >
    Exact computation can be replaced with a cheaper approximation when the quality
    degradation is bounded or acceptable for the task. Unlike quantization, the
    approximation may change model behavior rather than just numerical precision.

speculate:
  label: "Speculate to hide sequential latency"
  short: "Speculate"
  category: efficiency
  description: >
    When the result of a sequential dependency cannot be known in advance, a guess
    can be issued early and verified later. Correct speculations eliminate waiting;
    incorrect ones require rollback, so speculation pays off when the hit rate is high.

batch:
  label: "Batch to amortize fixed overheads"
  short: "Batch"
  category: efficiency
  description: >
    Fixed per-call costs — kernel launch, memory allocation, data movement —
    can be spread across many requests by grouping them. Larger batches improve
    hardware utilization up to the point of memory or latency constraints.

balance:
  label: "Balance load to maximize utilization"
  short: "Balance"
  category: distributed
  description: >
    When parallel workers have unequal amounts of work, the faster workers idle
    waiting for the slowest. Eliminating this imbalance is often the dominant
    performance lever at large scale.

specialize:
  label: "Specialize divergent workloads for independent optimizations"
  short: "Specialize"
  category: distributed
  description: >
    When a workload contains structurally different sub-tasks — prefill vs. decode,
    dense vs. sparse, prompt vs. completion — separating them lets each be optimized
    independently without compromising the other.

elastic:
  label: "Scale elastically to fill spare capacity"
  short: "Elastic"
  category: distributed
  description: >
    Resources left idle by the primary workload can be reclaimed by secondary tasks
    — speculative decoding, background prefetch, auxiliary training — as long as the
    primary workload can reclaim them on demand.

search-ai:
  label: "Search with AI for verifiable problems"
  short: "Search with AI"
  category: tooling
  description: >
    When an objective is deterministic and benchmarkable, AI agents can explore
    the solution space more effectively than hand-crafted heuristics, using
    code execution to evaluate and rank candidates.

portable:
  label: "Abstract hardware to preserve deployment optionality"
  short: "Portable"
  category: tooling
  description: >
    Coupling a system tightly to one hardware vendor or interconnect sacrifices
    the ability to migrate to cheaper or faster alternatives. Hardware-agnostic
    abstractions preserve flexibility at the cost of some per-platform optimization.

simplify:
  label: "Simplify to remove mechanisms that cost more than they save"
  short: "Simplify"
  category: efficiency
  # TODO(revisit): the boundary against `fuse` (avoiding intermediate materialization)
  # and `skip` is not crisp enough yet — several papers arguably qualify under either.
  # Draft principles are stripped from the production build; they render only under
  # --dev. Decide to sharpen the definition or drop the principle, then remove this.
  status: draft
  description: >
    Added mechanisms — scheduling layers, format-conversion stages, per-case
    specializations — impose their own overhead. When that overhead exceeds the
    benefit the mechanism was designed to provide, removing it yields counterintuitive
    gains: simpler designs expose hardware-native efficiency by eliminating
    accidental complexity.
